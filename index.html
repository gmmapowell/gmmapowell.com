  <body>
    <div id='flaselt_root'></div>
<script type='module'>
  import { JSEnv } from "/js/flaslive.js";
  const env = new JSEnv();
  const baseUri = '';
  env.broker.connectToServer(null);
  const cx = env.newContext();
  import { mod_services } from "/js/services.js";
  mod_services._init(cx);
  import { root__package } from "/js/root.package.js";
  root__package._init(cx);
  import { com__gmmapowell } from "/js/com.gmmapowell.js";
  com__gmmapowell._init(cx);
  env.makeReady();
  var appl = new com__gmmapowell._Application(cx, 'flaselt_root', baseUri);
  appl.securityModule = { requireLogin: function() { return true; } };
  appl.gotoRoute(cx, window.location);
</script>
