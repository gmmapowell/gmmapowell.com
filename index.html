<html>
	<head>
		<title>Gareth Powell</title>
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="HandheldFriendly" content="true">
<style>
body {
	margin: 0;
	overflow: hidden;
}
#container {
	overflow: hidden;
	position: relative;
	width: 100vw;
	height: 100vh;
}
#thing {
	position: absolute;
}
</style>
	</head>
	<body onload='onload()'>
		<div id='container'>
			<div id='thing'>
				<img id='pic' onload='resize()'>
			</div>
		</div>
	<script>
		var i = document.querySelector('#pic');
		var c = document.getElementById('container');
		var t = document.getElementById('thing');
		i.addEventListener('click', function(ev) {
			console.log(ev.x/ i.width *100, ev.y / i.height *100);
		});
		var currpage;
		function resize(ev) {
			var lx = currpage.lx;
			var ty = currpage.ty;
			var rx = currpage.rx;
			var by = currpage.by;
			var pw = rx - lx;
			var ph = by - ty;
			console.log("size", c.clientWidth, c.clientHeight);
			var vprat = c.clientWidth / c.clientHeight;
			var imgrat = i.width/i.height;
			var intrat = (i.width * pw)/(i.height * ph);
			console.log("rat", vprat, imgrat, intrat);

			if (vprat > intrat) { // landscape
				// 1. Figure the desired height of the image to appear in the container and make that thing.height
				var newThingHeight = c.clientHeight / ph;
				t.style.height = newThingHeight;
				i.style.height = newThingHeight;
				t.style.width = "auto";
				i.style.width = "auto";

				// 2. We want the top to be -61% of that
				t.style.top = (-newThingHeight * ty) + "px";

				// 3. Figure out the new image width and see what happens to 33% of that
				var newImgWid = newThingHeight * imgrat;
				var wanted = pw * newImgWid;
				var excess = c.clientWidth - wanted;
				console.log("wid", newImgWid, excess);

				// 4. Put left at lx - .5 *excess
				var left = (-newImgWid*lx+excess/2);
				if (left + newImgWid < c.clientWidth) {
					left = c.clientWidth - newImgWid;
					if (left > 0)
						left /= 2;
				}
				t.style.left = left;
			} else { // portrait
				// 1. Figure the desired width of the image to appear in the container and make that thing.width
				var newThingWidth = c.clientWidth / pw;
				t.style.width = newThingWidth;
				i.style.width = newThingWidth;
				t.style.height = "auto";
				i.style.height = "auto";

				// 2. We want the left hand side to be -59% of that
				t.style.left = (-newThingWidth * lx) + "px";

				// 3. Figure out the new image height and see what happens to 26% of that
				var newImgHt = newThingWidth / imgrat;
				var wanted = ph * newImgHt;
				var excess = c.clientHeight - wanted;
				console.log("ht", newImgHt, excess);

				// 4. Put top at ty - .5 *excess
				var top = (-newImgHt*ty+excess/2);
				if (top + newImgHt < c.clientHeight) {
					top = c.clientHeight - newImgHt;
					if (top > 0)
						top /= 2;
				}
				t.style.top = top;
			}
		};
		var pages = {
			hollingworth: {
				img: 'hollingworth.jpg',
				lx: 0.59, rx: 0.92,
				ty: 0.61, by: 0.87
			},
			library: {
				img: 'library.jpg',
				lx: 0.32, rx: 0.85,
				ty: 0.43, by: 0.99
			},
			shambles: {
				img: 'shambles.jpg',
				lx: 0.31, rx: 0.68,
				ty: 0.37, by: 0.88
			}
		};
		window.addEventListener('resize', resize);
		window.addEventListener('hashchange', onload);
		function onload() {
			var hash = location.hash;
			if (hash)
				hash = hash.substring(1);
			if (hash && pages[hash])
				currpage = pages[hash];
			else
				currpage = pages['hollingworth'];
			var i = document.getElementById('pic');
			i.src = 'images/' + currpage.img;
			resize();
		}
	</script>
	</body>
</html>
