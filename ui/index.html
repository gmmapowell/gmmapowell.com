<html>
	<head>
		<title>Gareth Powell</title>
		<!-- TODO: all of this should be in the default index.html or else configured in FA -->
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="HandheldFriendly" content="true">
	</head>
	<body>
		<div id='flas-card-root'>
			<div id='flas-punnet-contains'>
				<div id='flas-card-home'>
					<img id='flas-content-backdrop'>
					<div id='flas-style-creative' class='tile'>
						<div id='flas-style-creative-text' class='center-me'>
							Creative Writing
						</div>
					</div>
					<div id='flas-style-sports' class='tile'>
						<div id='flas-style-sports-text' class='center-me'>
							Sports
						</div>
					</div>
					<div id='flas-style-politics' class='tile'>
						<div id='flas-style-politics-text' class='center-me'>
							Politics
						</div>
					</div>
					<div id='flas-style-technology' class='tile'>
						<div id='flas-style-technology-text' class='center-me'>
							Technology
						</div>
					</div>
					<div id='flas-style-gallery' class='tile'>
						<div id='flas-style-gallery-text' class='center-me'>
							Gallery
						</div>
					</div>
					<div id='flas-style-organizations' class='tile'>
						<div id='flas-style-organizations-text' class='center-me'>
							Organizations
						</div>
					</div>
					<div id='flas-style-hireme' class='tile'>
						<div id='flas-style-hireme-text' class='center-me'>
							Hire Me
						</div>
					</div>
				</div>
				<div id='flas-card-politics'>
					<img id='flas-content-backdrop'>
					<div class='article-layout'>
						<div class='article-split'>
							<div id='flas-content-politics-article-title' class='article-title'></div>
							<div id='flas-punnet-politics-articles' class='article-remaining'>
							</div>
						</div>
					</div>
				</div>
				<div id='flas-card-sports'>
					<img id='flas-content-backdrop'>
					<div class='article-layout'>
						<div class='article-split'>
							<div id='flas-content-article-title' class='article-title'></div>
							<div id='flas-punnet-articles' class='article-remaining'>
								<div id='flas-card-article-list'>
									<div id='flas-container-article-titles' class='article-title-list'>
										<div id='flas-item-article-title'>
											<a id='flas-content-link' class='article-link-style'></a>
										</div>
									</div>
								</div>
								<div id='flas-card-article-html'>
									<div id='flas-content-content'>
										
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div id='flas-card-gallery'>
					<img id='flas-content-backdrop'>
					<div id='flas-container-gallery'>
						<div id='flas-item-image'>
							<div class='image-frame'>
								<img id='flas-content-gallery-image'>
								<div id='flas-style-left'><img src='images/left-arrow.png'></div>
								<div id='flas-style-right'><img src='images/right-arrow.png'></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id='container'>
			<!-- TODO: all images should be backed by spinner -->
			<div class='spinner-holder'>
				<div class='spinner-cell'>
					<div class='spinner'></div>
				</div>
			</div>
			<div id='thing'>
				<!-- TODO: images should display with spinner & onload that turns the spinner off; this implies visibility/hidden things -->
				<img id='pic' onload='show()'>
			</div>
		</div>
	</body>
</html>
