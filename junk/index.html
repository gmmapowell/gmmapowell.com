<html>
	<head>
		<title>Gareth Powell</title>
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="HandheldFriendly" content="true">
<!-- what I think I want is everything to be on Ziniki using FLAS and to have all the necessary components and plugins so that it all just works -->
<!-- Think content management with everything in the appropriate content stores, arenas and crobags -->
<style>
body {
	margin: 0;
	overflow: hidden;
}
#container {
	overflow: hidden;
	position: relative;
	width: 100vw;
	height: 100vh;
}
#thing {
	position: absolute;
}
.spinner-holder {
	position: relative;
	width: 100%;
	height: 100%;
	display: table;
}
.spinner-cell {
	display: table-cell;
	vertical-align: middle;
	text-align: center;
}
.spinner {
    margin: auto;
    border: 16px solid #f3f3f3; /* Light grey */
    border-top: 16px solid #3498db; /* Blue */
    border-radius: 50%;
    width: 120px;
    height: 120px;
    animation: spin 2s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
				.text {
					position: absolute;
					top: 10%;
					left: 10%;
					width: 80%;
					height: 80%;
					column-width: 14em;
					column-gap: 4em;
					overflow-x: auto;
					background: #f0f0ffc8;
					padding: 10px;
					font-size: 15pt;
				}
				.hidden {
					display: none;
				}
</style>
	</head>
	<body onload='onload()'>
		<div id='container'>
			<div class='spinner-holder'>
				<div class='spinner-cell'>
					<div class='spinner'></div>
				</div>
			</div>
			<div id='thing'>
				<img id='pic' onload='show()'>
			</div>
			<!-- TODO: it's now fairly obvious to me that want I really want here is a "content" thing
	       		  - that is initially empty and is styled with absolute positioning.  It then does a "fetch"
			  - to find the content that's wanted (as HTML) and inserts that, as a set of divs.

			  - Each of the divs has a class, and those classes are defined by a set of stylesheets, all
			  - of which have media queries about size and aspect ratio.  Because the container is absolutely
			  - positioned, the children can be as well, and all the positions are % relative to the container.

			  - There are different classes for buttons, menus (i.e. lists of things such as articles)
			  - and text (i.e. when you get to an article).
			-->
			<div id='text' class='text hidden'>
			</div>
		</div>
	<script>
		var i = document.querySelector('#pic');
		var c = document.getElementById('container');
		var t = document.getElementById('thing');
		var currpage;
		function resize(ev) {
			var cx = currpage.cx;
			var cy = currpage.cy;
			var lx = currpage.lx;
			var ty = currpage.ty;
			var rx = currpage.rx;
			var by = currpage.by;
			console.log("size", c.clientWidth, c.clientHeight);
			var vprat = c.clientWidth / c.clientHeight;
			var imgrat = i.width/i.height;
			console.log("rat", vprat, imgrat);
			if (isNaN(imgrat))
				return;

			if (vprat < imgrat) { // portrait
				// 1. Figure the desired height of the image to appear in the container and make that thing.height
				var newThingHeight = c.clientHeight;
				t.style.height = newThingHeight;
				i.style.height = newThingHeight;
				t.style.width = "auto";
				i.style.width = "auto";

				// 2. We want to make it reach the top
				t.style.top = 0;

				// 3. Figure out the new image width
				var newImgWid = newThingHeight * imgrat;
				var wanted = newImgWid;
				var excess = wanted - c.clientWidth;
				console.log("wid", newImgWid, excess);

				// 4. Put left at cx - .5 *excess
				var left = -(newImgWid*cx-c.clientWidth/2);
				if (left + newImgWid < c.clientWidth) {
					left = c.clientWidth - newImgWid;
					if (left > 0)
						left /= 2;
				}
				t.style.left = left;
			} else { // landscape
				// 1. Figure the desired width of the image to appear in the container and make that thing.width
				var newThingWidth = c.clientWidth;
				t.style.width = newThingWidth;
				i.style.width = newThingWidth;
				t.style.height = "auto";
				i.style.height = "auto";

				// 2. We want to make it reach both sides
				t.style.left = 0

				// 3. Figure out the new image height
				var newImgHt = newThingWidth / imgrat;
				var wanted = newImgHt;
				var excess = wanted - c.clientHeight;
				console.log("ht", newImgHt, excess);

				// 4. Put top at cy - .5 *excess
				var top = -(newImgHt*cy-c.clientHeight/2)
				if (top + newImgHt < c.clientHeight) {
					top = c.clientHeight - newImgHt;
					if (top > 0)
						top /= 2;
				}
				t.style.top = top;
			}
		};
		var pages = {
			hollingworth: {
				img: 'hollingworth.jpg',
				cx: 0.75, cy: 0.73,
				lx: 0.59, rx: 0.92,
				ty: 0.61, by: 0.87,
				buttons: [
					{ "text" : "Politics", hash: "library", x: 0.61, y: 0.65 },
					{ "text" : "Sports", hash: "shambles", x: 0.82, y: 0.68 },
					{ "text" : "Computers", hash: "library", x: 0.71, y: 0.69 },
					{ "text" : "Creative", hash: "library", x: 0.71, y: 0.69 },
					{ "text" : "Gallery", hash: "library", x: 0.71, y: 0.69 },
					{ "text" : "Organizations", hash: "library", x: 0.71, y: 0.69 },
					{ "text" : "Hire Me", url: "http://hireme.gmmapowell.com", x: 0.85, y: 0.82 }
				]
			},
			library: {
				img: 'library.jpg',
				lx: 0.32, rx: 0.85,
				ty: 0.43, by: 0.99
			},
			shambles: {
				img: 'shambles.jpg',
				lx: 0.31, rx: 0.68,
				ty: 0.37, by: 0.88
			}
		};
		function show() {
			resize();
			var t = document.getElementById('thing');
			t.style.display = 'block';
		}
		window.addEventListener('resize', resize);
		window.addEventListener('hashchange', onload);
		function onload() {
			var hash = location.hash;
			if (hash)
				hash = hash.substring(1);
			if (hash && pages[hash])
				currpage = pages[hash];
			else
				currpage = pages['hollingworth'];
			var i = document.getElementById('pic');
			i.src = 'images/' + currpage.img;
			var t = document.getElementById('thing');
			t.style.display = 'none';
			var q = 0;
			while (q < t.children.length) {
				if (t.children[q].tagName == "BUTTON")
					t.children[q].remove();
				else
					q++;
			}
			if (currpage.buttons) {
				for (var q=0;q<currpage.buttons.length;q++) {
					var b = currpage.buttons[q];
					var e = document.createElement('button');
					t.appendChild(e);
					e.innerText = b.text;
					e.onclick = moveto(b.url, b.hash);
					e.style.position = 'absolute';
					e.style.left = (b.x*100) + "%";
					e.style.top = (b.y*100) + "%";
				}
			}
			resize();
		}
		// This is supposed to enable 'space' to cause the text box to scroll (vertically or horizontally as appropriate)
		document.getElementById('text').addEventListener('keyup', function(ev) {
			console.log(ev);
		});
		function moveto(url, hash) {
			if (url)
			      return () => window.location = url;
			else
				return () => window.location = "#" + hash;
		}
	</script>
	</body>
</html>
